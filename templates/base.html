<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shruti - Offline Audio Learning</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shruti.css') }}">
</head>
<body>
    <a href="#main" class="skip-link">Skip to main content</a>

    <header>
        <h1>{{ page_h1 }}</h1>

    <main id="main" tabindex="-1">
        {% block content %}{% endblock %}

    <div aria-live="polite" id="aria-live-progress"></div>
    <div aria-live="polite" id="aria-live-messages"></div>

    <footer>
        <p>Shruti — Offline Audio Learning</p>
    </footer>
</body>
</html>
